# The live rig: real dosemu, real BRE and Falcon's Eye, real packets.
#
# This cannot run on a hosted runner. It needs the provisioned installs under
# their own unix users on novatest-hl, so it requires a self-hosted runner there
# labelled `novatest`. Until such a runner exists this workflow is inert --
# workflow_dispatch will simply find nothing to run on.
#
# Nightly rather than per-push on purpose. A full run is about a minute and a
# half, but a pristine fixture is only pristine on its capture date, so the first
# run of any day rebuilds all ten installs first. That is a few minutes, once.
name: live-rig

on:
  schedule:
    # 03:00 local. Production BRE runs roughly hourly and FE every ~4 days, so
    # this is the quiet end of the day for the games it shares a machine with.
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  rig:
    runs-on: novatest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Sync the working tree to the rig checkout
        # The rig runs from /srv/novatest/nova-hub, which the node users can read.
        run: |
          sudo rsync -a --delete \
            --exclude .git --exclude frontend --exclude .venv \
            ./ /srv/novatest/nova-hub/
          sudo find /srv/novatest/nova-hub -name '._*' -delete
          sudo chmod -R a+rX /srv/novatest/nova-hub

      - name: Install what the rig interpreter needs
        # sr-harness (which drives the games) and bre-agent (the decision module
        # player.py asks) are rig dependencies, not product ones, so they are not
        # in requirements.txt. Both are pinned to tags over https -- the repos
        # are public, so the runner needs no credentials.
        # Cheap when already satisfied, and the alternative is a machine that
        # looks fine until a walk dies on an ImportError.
        run: |
          sudo -u novahub-t /srv/novatest/venv/bin/python -m pip install -q \
            -r /srv/novatest/nova-hub/tests/live/requirements.txt

      - name: Run the rig
        # run.sh rebuilds stale fixtures by itself, then runs the suite as the
        # hub user. A non-zero exit is a real failure: the tree skips itself
        # only when dosemu is missing, which on this runner would be the news.
        run: |
          sudo -u novahub-t /srv/novatest/nova-hub/tests/live/run.sh -q

      - name: Transcripts on failure
        if: failure()
        # A failed game run is diagnosed from its dosemu transcript and nothing
        # else. Without these the failure is unreadable after the fact.
        run: |
          sudo tar -czf /tmp/rig-logs.tgz -C /srv/novatest logs || true
          sudo chmod a+r /tmp/rig-logs.tgz || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: dosemu-transcripts
          path: /tmp/rig-logs.tgz
          if-no-files-found: ignore
