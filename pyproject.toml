# Dependencies, as ranges. The exact versions dev, CI and prod run are in
# uv.lock: `uv sync` builds .venv from it, `uv lock --upgrade-package X` moves
# one. requirements.txt is exported from the lock for pip-based installs (the
# deploy playbook); CI fails if it falls out of step:
#
#     uv export --frozen --no-dev --no-emit-project --no-hashes -o requirements.txt

[project]
name = "nova-hub"
version = "0"  # unused: never built. The hub's version is backend/core/version.py
requires-python = ">=3.12"
dependencies = [
    # Core
    "fastapi>=0.128.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.13.1",
    # Logging
    "loguru>=0.7.2",
    # Templates
    "jinja2>=3.1.4",
    # File handling
    "aiofiles>=24.1.0",
    "python-multipart>=0.0.17",
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.1,<4.1",  # passlib 1.7.4 breaks on bcrypt 4.1+
    # Config
    "toml>=0.10.2",
    "python-dotenv>=1.0.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    # File watching
    "watchdog>=6.0.0",
    # HTTP client (alert webhooks, backend/services/alert_service.py)
    "aiohttp>=3.14.3",
    # HTTP client (provider sign-in, backend/services/identity_provider.py; also
    # FastAPI TestClient)
    "httpx>=0.27.2",
    # ANSI to HTML conversion for logs
    "ansi2html>=1.9.1",
    # HTML parsing
    "beautifulsoup4>=4.12.3",
    # Drives the game's own reset editor (backend/services/game_reset/). The
    # live rig installs the same tag from tests/live/requirements.txt.
    "sr-harness @ git+https://gitea-hl.taild204f.ts.net/lime/sr-harness.git@v0.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
# No async fixtures; this only silences pytest-asyncio's warning that it is unset.
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # python-jose 3.x calls datetime.utcnow() itself when it checks a token.
    "ignore:datetime.datetime.utcnow:DeprecationWarning:jose",
]

[tool.uv]
package = false
